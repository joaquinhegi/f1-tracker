name: f1-tracker

x-openf1-env: &openf1-env
  MONGO_CONNECTION_STRING: ${MONGO_CONNECTION_STRING:-mongodb://mongo:27017}
  OPENF1_DB_NAME: ${OPENF1_DB_NAME:-openf1-livetiming}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7  # mongo 8 crashes on Linux kernel >= 6.19 (SERVER-121912)
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mongo-data:/data/db
    # Local debugging only; never reachable from outside the host.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: openf1/Dockerfile
      target: openf1
    image: ${IMAGE_PREFIX:-f1-tracker}-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *openf1-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: openf1/Dockerfile
      target: scheduler
    image: ${IMAGE_PREFIX:-f1-tracker}-scheduler:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    init: true  # reaps the ingestor's child processes
    stop_grace_period: 60s  # lets the scheduler stop the ingestor cleanly
    environment:
      <<: *openf1-env
      F1_TOKEN: ${F1_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      TOKEN_CHECK_MINUTES: ${TOKEN_CHECK_MINUTES:-360}
      SCHEDULE_CACHE_PATH: /data/schedule-cache.json
      POLL_SECONDS: ${POLL_SECONDS:-30}
      SYNC_LOCAL_SCHEDULE: ${SYNC_LOCAL_SCHEDULE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Historical backfill from the F1 static archive (see README). Default
      # true suits local dev (there is usually recent data worth
      # backfilling). For a first production deploy, set
      # BACKFILL_ENABLED=false in infra/.env -- see RUNBOOK.md.
      BACKFILL_ENABLED: ${BACKFILL_ENABLED:-true}
      BACKFILL_PUBLISH_DELAY_MINUTES: ${BACKFILL_PUBLISH_DELAY_MINUTES:-60}
      BACKFILL_RETRY_MINUTES: ${BACKFILL_RETRY_MINUTES:-30}
      BACKFILL_GIVE_UP_MINUTES: ${BACKFILL_GIVE_UP_MINUTES:-2880}
      BACKFILL_STATE_PATH: /data/backfill-state.json
      LOCAL_API_URL: http://api:8000
    volumes:
      - scheduler-data:/data
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-f1-tracker}-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      OPENF1_SELF_HOSTED_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - web-cache:/cache
    depends_on:
      api:
        condition: service_started

volumes:
  mongo-data:
  scheduler-data:
  web-cache:
